name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install platform, build-tools and NDK (SDK bawaan runner)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Pakai sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Terapkan patch dari folder patches/
        run: |
          if ls patches/*.patch >/dev/null 2>&1; then
            for p in patches/*.patch; do
              echo "Menerapkan $p"
              git apply --whitespace=nowarn "$p"
            done
          else
            echo "Tidak ada patch, build kode asli."
          fi

      - name: Pasang modul logviewer (jika ada)
        run: |
          if [ -d logviewer ]; then
            if [ ! -f settings.gradle ] || [ ! -f app/build.gradle ]; then
              echo "settings.gradle atau app/build.gradle tidak ditemukan:"
              ls
              exit 1
            fi
            grep -q "':logviewer'" settings.gradle || printf "\ninclude ':logviewer'\n" >> settings.gradle
            grep -q "project(':logviewer')" app/build.gradle || printf "\ndependencies {\n    implementation project(':logviewer')\n}\n" >> app/build.gradle
            echo "Modul logviewer terpasang."
          else
            echo "Modul logviewer tidak ada, dilewati."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

      - name: Kirim APK ke Telegram
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          find . -path '*/build/outputs/apk/*' -name '*.apk' | while read -r APK; do
            NAME=$(basename "$APK")
            SIZE=$(stat -c%s "$APK")
            if [ "$SIZE" -gt 52428800 ]; then
              curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="$TG_CHAT" \
                -d text="Build #$GITHUB_RUN_NUMBER: $NAME lebih dari 50 MB. Ambil dari Actions > Artifacts."
            else
              curl -fsS -F chat_id="$TG_CHAT" -F document=@"$APK" \
                -F caption="Build #$GITHUB_RUN_NUMBER: $NAME" \
                "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
            fi
          done
